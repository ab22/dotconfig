version: "3"

# One entry point per concern — every task auto-detects the platform
# (macos | archlinux) via scripts/detect-os.sh, so the same command works on
# every machine. To target a platform explicitly, call the script directly:
#   scripts/gen.sh macos
#   scripts/link.sh archlinux

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  gen:
    desc: Generate OS-specific config artifacts (auto-detects macos/archlinux)
    cmds:
      - scripts/gen.sh

  link:
    desc: Symlink dotfiles, generated configs, and global AI agent files into $HOME
    cmds:
      - scripts/link.sh

  install:
    desc: Full machine setup — generate artifacts, then create every symlink
    cmds:
      - task: gen
      - task: link
